# CI: type-check, lint, and unit tests on every push to main and every PR.
# Mirrors the local scripts (npm run typecheck / lint / test).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npm run typecheck

      - name: Lint (expo lint)
        run: npm run lint

      - name: Unit tests (jest)
        run: npm test -- --ci
